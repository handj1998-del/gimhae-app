<script>
try{if(navigator.serviceWorker)navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(x){x.unregister()})});if(window.caches)caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})})}catch(e){}
(function () {
  var dest = new URL('https://gimhae-app.lotterental-gimhae.workers.dev/');
  var prefix = '/gimhae-app';
  var path = location.pathname || "/";
  if (path === prefix || path.indexOf(prefix + "/") === 0) {
    path = path.slice(prefix.length) || "/";
  }
  dest.pathname = path;
  dest.search = location.search;
  dest.hash = location.hash;
  location.replace(dest.href);
})();
</script>
