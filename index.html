const PDFV="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/",PDF_MAX=30;let pdfjs,pdfBusy=false;

function pageName(base,n,total,text){if(total===1)return base;const L=text.split("\n").map(s=>s.trim()).filter(Boolean);
