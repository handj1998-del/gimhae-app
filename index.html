<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#da291c"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png">
<title>김해공항 롯데렌터카 안내</title>
<style>
body{margin:0;font-family:sans-serif;background:#f4f4f6;color:#222}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;padding:24px;box-sizing:border-box}
h1{color:#da291c;font-size:22px;text-align:center}
.btn{display:block;width:100%;padding:18px;margin:12px 0;font-size:18px;border:none;border-radius:12px;background:#da291c;color:#fff;cursor:pointer}
.btn.sub{background:#fff;color:#da291c;border:2px solid #da291c}
.back{background:none;border:none;color:#666;font-size:15px;cursor:pointer;padding:0}
.hidden{display:none}
</style></head><body><div class="wrap" id="app"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const fb=initializeApp({apiKey:"AIzaSyC2zl8XARZ9ha9_aihICO4T4b1tGKi02C4",authDomain:"gimhae-lotte.firebaseapp.com",projectId:"gimhae-lotte",storageBucket:"gimhae-lotte.firebasestorage.app",messagingSenderId:"76093741699",appId:"1:76093741699:web:e30a9489803c5552da59b6"});
const auth=getAuth(fb),db=getFirestore(fb);
const T={
ko:{title:"메뉴를 선택하세요",menu:["렌터카 반납 안내","보험 안내","관광 가이드"],back:"← 언어 선택",back2:"← 메뉴",soon:"내용 준비 중입니다.",load:"불러오는 중…"},
en:{title:"Select a menu",menu:["Car Return Guide","Insurance Info","Tour Guide"],back:"← Language",back2:"← Menu",soon:"Content coming soon.",load:"Loading…"},
zh:{title:"请选择菜单",menu:["还车指南","保险说明","旅游指南"],back:"← 选择语言",back2:"← 菜单",soon:"内容准备中。",load:"加载中…"},
tw:{title:"請選擇選單",menu:["還車指南","保險說明","旅遊指南"],back:"← 選擇語言",back2:"← 選單",soon:"內容準備中。",load:"載入中…"}};
const IDS=["return","insurance","tour"],LN={ko:"한국어",en:"English",tw:"中文(繁體)",zh:"中文(简体)"};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app=document.getElementById('app');let lang;
const ERR={"auth/invalid-credential":"이메일 또는 비밀번호가 틀렸어요.","auth/wrong-password":"비밀번호가 틀렸어요.","auth/user-not-found":"등록되지 않은 이메일이에요.","auth/invalid-email":"이메일 형식이 올바르지 않아요.","auth/too-many-requests":"시도가 너무 많아요. 잠시 후 다시 해 주세요.","auth/network-request-failed":"인터넷 연결을 확인해 주세요.","permission-denied":"저장 권한이 없어요. Firestore 규칙을 확인해 주세요.","unavailable":"서버에 연결할 수 없어요. 인터넷을 확인해 주세요."};
const msg=e=>ERR[e&&e.code]||("오류가 발생했어요: "+(e&&(e.code||e.message)));
window.home=function(){app.innerHTML=`<h1>김해공항 롯데렌터카<br>Gimhae Airport · 金海机场</h1>
<button class="btn" onclick="menu('ko')">한국어</button>
<button class="btn" onclick="menu('en')">English</button>
<button class="btn" onclick="menu('tw')">中文(繁體)</button>
<button class="btn" onclick="menu('zh')">中文(简体)</button>
<p style="text-align:center;margin-top:40px"><a href="#" onclick="adminEntry();return false" style="color:#bbb;font-size:12px;text-decoration:none">관리자</a></p>`}
window.menu=function(l){lang=l;const t=T[l];app.innerHTML=`<button class="back" onclick="home()">${t.back}</button><h1>${t.title}</h1>`+
t.menu.map((m,i)=>`<button class="btn sub" onclick="page(${i})">${m}</button>`).join('')}
window.page=async function(i){const t=T[lang],l=lang;app.innerHTML=`<button class="back" onclick="menu('${l}')">${t.back2}</button><h1>${t.menu[i]}</h1><div id="pc" style="line-height:1.6">${t.load}</div>`;
let txt="";try{const d=await getDoc(doc(db,"pages",IDS[i]));if(d.exists())txt=(d.data()[l]||"").trim();}catch(e){}
const pc=document.getElementById('pc');if(pc&&lang===l)pc.innerHTML=txt?esc(txt).replace(/\n/g,"<br>"):`<p>${t.soon}</p>`}
const inp='width:100%;padding:12px;margin:6px 0;font-size:16px;box-sizing:border-box;border:1px solid #ccc;border-radius:8px';
window.adminEntry=()=>auth.currentUser?admin():login();
function login(){app.innerHTML=`<button class="back" onclick="home()">← 처음으로</button><h1>관리자 로그인</h1>
<form id="lf"><input id="em" type="email" placeholder="이메일" autocomplete="username" style="${inp}" required>
<input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" style="${inp}" required>
<button class="btn" type="submit">로그인</button></form><p id="er" style="color:#da291c"></p>`;
document.getElementById('lf').onsubmit=async e=>{e.preventDefault();const er=document.getElementById('er');er.textContent="로그인 중…";
try{await signInWithEmailAndPassword(auth,document.getElementById('em').value.trim(),document.getElementById('pw').value);admin();}catch(x){er.textContent=msg(x);}}}
const PN=["렌터카 반납 안내","보험 안내","관광 가이드"];
async function admin(sel=0){app.innerHTML=`<button class="back" onclick="home()">← 처음으로</button><h1>내용 수정</h1>
<p style="font-size:13px;color:#666">${esc(auth.currentUser.email)} <button class="back" style="color:#da291c" onclick="logout()">로그아웃</button></p>
<select id="ps" style="${inp}">${PN.map((n,i)=>`<option value="${i}"${i==sel?" selected":""}>${n}</option>`).join('')}</select>
${Object.keys(LN).map(k=>`<label style="font-weight:bold">${LN[k]}</label><textarea id="ta_${k}" rows="6" style="${inp}"></textarea>`).join('')}
<button class="btn" id="sv">저장</button><p id="st"></p>`;
const st=document.getElementById('st');document.getElementById('ps').onchange=e=>admin(+e.target.value);
st.textContent="불러오는 중…";try{const d=await getDoc(doc(db,"pages",IDS[sel]));const v=d.exists()?d.data():{};Object.keys(LN).forEach(k=>document.getElementById('ta_'+k).value=v[k]||"");st.textContent="";}catch(e){st.textContent=msg(e);}
document.getElementById('sv').onclick=async()=>{st.style.color="#333";st.textContent="저장 중…";const data={updatedAt:serverTimestamp()};Object.keys(LN).forEach(k=>data[k]=document.getElementById('ta_'+k).value);
try{await setDoc(doc(db,"pages",IDS[sel]),data,{merge:true});st.style.color="green";st.textContent="저장했어요 ✓";}catch(e){st.style.color="#da291c";st.textContent=msg(e);}}}
window.logout=async()=>{await signOut(auth);home();};
home();
</script><button id="installBtn" style="display:none;position:fixed;right:16px;bottom:16px;padding:12px 18px;border:0;border-radius:24px;background:#da291c;color:#fff;font-size:15px;font-weight:bold;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;z-index:999">설치하기 / Install</button>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}
let deferredPrompt;const ib=document.getElementById('installBtn');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;ib.style.display='block';});
ib.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;ib.style.display='none';});
addEventListener('appinstalled',()=>{ib.style.display='none';});
</script></body></html>
