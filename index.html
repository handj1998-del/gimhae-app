<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard Variable",Pretendard,"Noto Sans TC","Noto Sans SC",-apple-system,system-ui,sans-serif;background:linear-gradient(180deg,#eceef2,#f7f7f9);color:#1d1d1f;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.shell{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#fafafb;box-shadow:0 0 40px rgba(0,0,0,.06)}

.title{margin:8px 0;font-size:20px;font-weight:700;text-align:center}
.btn{display:flex;align-items:center;gap:16px;width:100%;height:72px;padding:0 24px;border:0;border-radius:16px;font:inherit;font-size:18px;font-weight:600;cursor:pointer;text-align:left;color:#fff;

box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 #9e1a10,0 8px 16px rgba(218,41,28,.28);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 0 #9e1a10,0 3px 8px rgba(218,41,28,.25)}
.btn small{display:block;font-size:12px;font-weight:500;opacity:.8;margin-top:2px}
.btn.sub{color:#1d1d1f;background:linear-gradient(180deg,#fff,#f1f2f5);box-shadow:inset 0 1px 0 #fff,0 4px 0 #d5d7dd,0 8px 16px rgba(0,0,0,.08)}

.ic{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:linear-gradient(180deg,#fde9e7,#f9d4d0);color:#da291c}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:0;border-radius:20px;font:inherit;font-size:14px;font-weight:600;color:#444;background:#fff;box-shadow:0 2px 0 #dcdde2,0 4px 8px rgba(0,0,0,.06);cursor:pointer}

.card p{margin:0;color:#888;text-align:center}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.grid .btn{height:60px;padding:0 18px;gap:14px;font-size:16px;text-decoration:none;line-height:1.3}
.grid .btn .ic{width:36px;height:36px;border-radius:10px}
.grid .btn .ic svg{width:20px;height:20px}
.lbl{flex:1;min-width:0}
.ext{flex:none;color:#da291c;opacity:.8}
.num{text-align:center;font-size:30px;font-weight:700;color:#1d1d1f;letter-spacing:.01em;margin:8px 0 4px}
.btn.call{justify-content:center;margin-top:20px;height:64px;text-decoration:none;font-size:20px;font-weight:700;gap:12px}
.btn.call svg{width:24px;height:24px}

.inp{width:100%;height:48px;padding:0 14px;border:1px solid #d5d7dd;border-radius:12px;font:inherit;font-size:16px;background:#fff}
.inp:focus{outline:2px solid #da291c;border-color:transparent}
textarea.inp{height:72px;padding:10px 14px;resize:vertical}
.err{color:#da291c;font-size:14px;margin:8px 0 0;text-align:center}
.ok{color:#1a7f37}
.sec{background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:10px}

.sbtn:disabled{opacity:.5}

.frow{display:flex;gap:10px;align-items:center}
.frow img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none}
.frow .inp{height:40px;font-size:14px}
.trow{border:1px dashed #d5d7dd;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.trow .inp{height:40px;font-size:14px}
.bar{height:10px;border-radius:5px;background:#eee;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#da291c;transition:width .2s}

.ex span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{flex:none;white-space:nowrap;border:0;background:#fde9e7;color:#c4220f;border-radius:8px;height:32px;padding:0 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.bc{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
.bc img{display:block;width:100%;height:auto;cursor:zoom-in;background:#f3f3f5}
.bc .bt{padding:14px 18px;font-size:15px;line-height:1.6;color:#333}
.bc .bt b{display:block;font-size:17px;color:#1d1d1f;margin-bottom:4px}
.bc .bt div{margin-top:2px}.bc .bt em{font-style:normal;color:#888;margin-right:6px}
.bc a.tel{color:#da291c;font-weight:700;text-decoration:none}
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;object-fit:contain}

#installBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #9e1a10}

try{const items=await timeout(list(),8000);$("exn").textContent=items.length;
box.innerHTML=items.length?items.map(b=>`<div class="ex">${b.img?`<img src="${esc(b.img)}" alt="">`:""}<span>${esc(b.title||b.name||"(제목 없음)")}${b.address?" · "+esc(b.address):""}</span><button class="del" data-id="${b.id}">삭제</button></div>`).join(""):`<div style="color:#888;font-size:14px">등록된 항목이 없습니다.</div>`;
box.querySelectorAll(".del").forEach(btn=>btn.onclick=async()=>{if(!confirm("이 항목을 삭제할까요?"))return;btn.disabled=true;try{const{f,db}=await F();await signIn();await f.deleteDoc(f.doc(db,"branches",btn.dataset.id));refresh()}catch(e){alert(emsg(e));btn.disabled=false}})}
catch(e){box.innerHTML=`<div class="err">${esc(emsg(e))}</div>`}}
function trow(){const d=document.createElement("div");d.className="trow";d.innerHTML=`<input class="inp" data-k="name" placeholder="지점명 (필수)"><input class="inp" data-k="address" placeholder="주소"><input class="inp" data-k="phone" type="tel" placeholder="전화번호"><input class="inp" data-k="hours" placeholder="영업시간"><textarea class="inp" data-k="memo" placeholder="메모"></textarea>`;return d}
async function panel(){hdr.className="small";app.className="";
app.innerHTML=`<button class="back" onclick="home()">${ARR}처음으로</button><h2 class="title">타지역 지점 안내 · 관리</h2>
<div id="st" style="font-size:13px;color:#888;text-align:center">Firebase 연결 중…</div>
<div class="sec"><h3>사진 올리기 (여러 장 한 번에)</h3><input id="files" type="file" accept="image/jpeg,image/png" multiple style="display:none"><button class="sbtn g" id="pick">사진 선택 (jpg, png)</button><div id="fl" style="display:flex;flex-direction:column;gap:8px"></div><button class="sbtn" id="up" disabled>사진 업로드</button></div>
<div class="sec"><h3>글로 지점 추가</h3><div id="tl" style="display:flex;flex-direction:column;gap:10px"></div><button class="sbtn g" id="addrow">+ 지점 한 칸 더</button><button class="sbtn" id="savet">지점 저장</button></div>
<div class="sec"><div class="bar" id="bar" style="display:none"><i></i></div><div id="prog" style="font-size:14px;text-align:center"></div><h3>등록된 항목 (<span id="exn">0</span>)</h3><div id="exl"></div></div>
<button class="adm-link" onclick="sessionStorage.removeItem('gadm');home()">로그아웃</button>`;scrollTo(0,0);
picked=[];$("tl").appendChild(trow());
$("pick").onclick=()=>$("files").click();
$("files").onchange=e=>{for(const f of e.target.files){if(!/image\/(jpeg|png)/.test(f.type))continue;picked.push({file:f,url:URL.createObjectURL(f),title:f.name.replace(/\.[^.]+$/,"")})}e.target.value="";drawPicked()};
$("addrow").onclick=()=>$("tl").appendChild(trow());
$("up").onclick=uploadImgs;$("savet").onclick=saveTexts;
try{const usr=await timeout(signIn(),10000);$("st").innerHTML=`<span class="ok">● 연결됨</span>`;window.__anonUid=usr.uid}catch(e){$("st").innerHTML=`<span class="err">${esc(emsg(e))}</span>`;window.__anonErr=e.code||e.message}
refresh()}
function drawPicked(){const fl=$("fl");fl.innerHTML="";picked.forEach((p,i)=>{const r=document.createElement("div");r.className="frow";r.innerHTML=`<img src="${p.url}" alt=""><input class="inp" placeholder="제목 (선택)" value="${esc(p.title)}"><button class="del">빼기</button>`;
r.querySelector("input").oninput=e=>p.title=e.target.value;r.querySelector("button").onclick=()=>{picked.splice(i,1);drawPicked()};fl.appendChild(r)});
$("up").disabled=!picked.length;$("up").textContent=picked.length?`사진 ${picked.length}장 업로드`:"사진 업로드"}
function prog(done,total,msg){const b=$("bar");b.style.display="block";b.firstChild.style.width=(total?done/total*100:0)+"%";$("prog").innerHTML=msg}
async function uploadImgs(){const btn=$("up");btn.disabled=true;const{f,db}=await F();let ok=0,fail=[];const n=picked.length;
try{await signIn()}catch(e){prog(0,n,`<span class="err">${esc(emsg(e))}</span>`);btn.disabled=false;return}
for(let i=0;i<n;i++){const p=picked[i];prog(i,n,`업로드 중… ${i+1} / ${n}`);
try{const img=await compress(p.file);await f.addDoc(f.collection(db,"branches"),{type:"image",title:(p.title||"").trim(),img,createdAt:f.serverTimestamp()});ok++}catch(e){fail.push(p.file.name+": "+emsg(e))}}
prog(n,n,`완료: ${ok}장 성공`+(fail.length?`<div class="err">${fail.length}장 실패<br>${fail.map(esc).join("<br>")}</div>`:""));
picked=picked.filter((p,i)=>false);drawPicked();refresh()}
async function saveTexts(){const rows=[...$("tl").querySelectorAll(".trow")].map(r=>{const o={};r.querySelectorAll("[data-k]").forEach(x=>o[x.dataset.k]=x.value.trim());return o}).filter(o=>o.name);
if(!rows.length){prog(0,0,`<span class="err">지점명을 입력하세요.</span>`);return}
const btn=$("savet");btn.disabled=true;const{f,db}=await F();let ok=0,fail=[];
try{await signIn()}catch(e){prog(0,rows.length,`<span class="err">${esc(emsg(e))}</span>`);btn.disabled=false;return}
for(let i=0;i<rows.length;i++){prog(i,rows.length,`저장 중… ${i+1} / ${rows.length}`);try{await f.addDoc(f.collection(db,"branches"),{type:"text",...rows[i],createdAt:f.serverTimestamp()});ok++}catch(e){fail.push(rows[i].name+": "+emsg(e))}}
prog(rows.length,rows.length,`완료: ${ok}개 저장`+(fail.length?`<div class="err">${fail.map(esc).join("<br>")}</div>`:""));
btn.disabled=false;if(ok){$("tl").innerHTML="";$("tl").appendChild(trow())}refresh()}
home();
</script></body></html>
