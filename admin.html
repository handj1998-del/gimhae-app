/* ---- PDF (pdf.js): 텍스트 레이어 우선, 없으면 페이지를 그려서 OCR ---- */
const PDFV="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/",PDF_MAX=30;let pdfjs,pdfBusy=false;
async function loadPDF(){if(pdfjs)return pdfjs;const m=await import(PDFV+"build/pdf.min.mjs");m.GlobalWorkerOptions.workerSrc=PDFV+"build/pdf.worker.min.mjs";return pdfjs=m}
function tcText(tc){const rows=[];let cur=null;
for(const it of tc.items){if(!("str" in it))continue;const x=it.transform[4],y=it.transform[5],h=it.height||Math.abs(it.transform[3])||10;
if(!cur||Math.abs(cur.y-y)>Math.max(2,h*.5)){cur={y,s:"",end:null};rows.push(cur)}
if(cur.end!==null&&x-cur.end>h*.25&&!/\s$/.test(cur.s)&&!/^\s/.test(it.str))cur.s+=" ";cur.s+=it.str;cur.end=x+(it.width||0);if(it.hasEOL)cur=null}
return rows.map(r=>r.s.replace(/\s+/g," ").trim()).filter(Boolean).join("\n")}
function pageName(base,n,total,text){if(total===1)return base;const L=text.split("\n").map(s=>s.trim()).filter(Boolean);
const k=L.find(l=>/(지점|영업소)/.test(l)&&l.length<=40&&!/^(주\s*소|전화|영업\s*시간)/.test(l));if(k)return k.replace(/^(지점명|영업소명|지점|영업소)\s*[:：]\s*/,"").trim()||`${base} p${n}`;
const f=L[0];if(f&&f.length>=2&&f.length<=30&&!/^(주\s*소|전화|tel|영업\s*시간|address|hours)/i.test(f)&&!/\d{3,}/.test(f))return f;return `${base} p${n}`}
function fillRow(p){if(p.el)p.el.querySelectorAll("[data-k]").forEach(x=>x.value=p[x.dataset.k]||"")}
function runPDF(files){pdfBusy=true;upBtn();ocrQ=ocrQ.then(async()=>{const st=$("pdfst"),warn=[];const say=h=>{if($("pdfst"))$("pdfst").innerHTML=h};
for(let fi=0;fi<files.length;fi++){const file=files[fi],base=cleanName(file.name),tag=(files.length>1?`[${fi+1}/${files.length}] `:"")+esc(file.name);
try{say(`${tag} · PDF 여는 중…`);const lib=await loadPDF();
const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),cMapUrl:PDFV+"cmaps/",cMapPacked:true,standardFontDataUrl:PDFV+"standard_fonts/"}).promise;
const total=doc.numPages,n=Math.min(total,PDF_MAX);if(total>PDF_MAX)warn.push(`${esc(file.name)}: ${total}쪽 중 앞 ${PDF_MAX}쪽만 읽었습니다. 나머지는 PDF를 나눠서 올려 주세요.`);
for(let pi=1;pi<=n;pi++){say(`${tag} · PDF ${pi}/${n}쪽 읽는 중…`);const page=await doc.getPage(pi);
const v1=page.getViewport({scale:1}),sc=Math.min(3,2000/Math.max(v1.width,v1.height)),vp=page.getViewport({scale:sc});
const cv=document.createElement("canvas");cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);const cx=cv.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,cv.width,cv.height);
await page.render({canvasContext:cx,viewport:vp}).promise;const img=fitJpeg(cv,cv.width,cv.height);
let raw="";try{raw=tcText(await page.getTextContent())}catch(e){}
const p={pdf:file.name,page:pi,img,url:img,name:total===1?base:`${base} p${pi}`,address:"",phone:"",hours:"",memo:"",ost:"",busy:true};picked.push(p);
if(raw.replace(/\s/g,"").length>20){p.via="text";p.ost=`PDF ${pi}쪽 · 글자 정보 읽는 중…`}else{p.via="ocr";p.ost=`PDF ${pi}쪽 · 이미지라 OCR 진행 (처음엔 언어 데이터 약 10MB 다운로드)`}

if(p.name===`${base} p${pi}`)p.name=pageName(base,pi,total,raw);p.ost=`✓ PDF ${pi}쪽 · `+(p.via==="text"?"PDF 글자에서 자동 입력":"OCR로 자동 입력")+" · 확인 후 수정하세요"}
else if(!/실패/.test(p.ost))p.ost=`PDF ${pi}쪽 · 글자를 찾지 못했습니다`;
p.busy=false;fillRow(p);upd(p);page.cleanup()}
await doc.destroy()}catch(e){warn.push(`${esc(file.name)}: PDF를 읽지 못했습니다 (${esc(e&&e.name==="PasswordException"?"암호가 걸린 PDF":(e.message||e))})`)}}
