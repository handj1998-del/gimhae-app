name: Render keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render app
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "https://gimhae-rental-guide-app.onrender.com/?keepalive=$(date +%s)" || echo 000)
            echo "attempt $i: HTTP $code"
            [ "$code" -ge 200 ] && [ "$code" -lt 400 ] && exit 0
            sleep 15
          done
          echo "::warning::Render app did not respond OK after 3 attempts"
      - name: Monthly activity commit (prevents 60-day schedule auto-disable)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          [ "$(date -u +%d%H)" = "0100" ] && [ "$(date -u +%M)" -lt 10 ] || exit 0
          git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" r && cd r
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit --allow-empty -m "chore: keepalive $(date -u +%F)"
          git push
